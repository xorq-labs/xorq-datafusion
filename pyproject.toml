[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "xorq-datafusion"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "pyarrow>=18.0.0,<22; python_version >= '3.10' and python_version < '4.0'",
]

[dependency-groups]
dev = [
    "codespell[hard-encoding-detection,toml]==2.4.1",
    "pre-commit==4.2.0",
    "pytest==8.3.5",
    "maturin>=1.7.4",
    "pip>=24.3.1",
    "ruff>=0.11.2",
    "pytest-cov>=6.0.0",
    "coverage[toml]==7.8.0",
    "ipython>=8.34.0",
    "git-cliff>=2.2.1,<3.0.0",
]
test = [
    "ibis-framework[duckdb]>=10.4.0",
    "numpy>=2.2.4",
    "pandas>=2.2.3",
    "hypothesis>=6.0.0",
    "batchcorder==0.1.3",
]

[tool.maturin]
module-name = "xorq_datafusion._internal"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff.lint]
# Preview is required for the pydoclint (DOC) rules.  Scoped two ways: it is
# lint-only (the formatter stays on stable style), and explicit-preview-rules
# limits it to the exact preview codes listed in extend-select — prefix
# selectors (RUF, B, UP, ...) keep selecting stable rules only, so a ruff
# upgrade cannot silently enable new preview rules (ruff is pinned at the
# matching rev in .pre-commit-config.yaml).
preview = true
explicit-preview-rules = true
ignore = [
    "D203", # conflicts with D211 (no-blank-line-before-class); D211 wins
    "D212", # conflicts with D213 (multi-line-summary-second-line); D213 wins
]
extend-select = [
    "I",       # isort
    "ICN",     # import conventions
    "B",       # flake8-bugbear: mutable default args, exception chaining, etc.
    "C4",      # flake8-comprehensions: unnecessary list/dict/set comprehensions
    "FURB",    # refurb: modernise Python code
    "PLC0415", # import-outside-toplevel: imports must be at module level
    "SIM",
    "PT",
    "D",
    # pydoclint, selected by exact code (preview rules; see explicit-preview-rules)
    "DOC201", # return value not documented in docstring
    "DOC202", # docstring documents a return the body does not have
    "DOC402", # yielded value not documented in docstring
    "DOC403", # docstring documents yields the body does not have
    "DOC501", # explicitly raised exception missing from docstring
    "DOC502", # docstring documents an exception the body does not raise
    "RUF",
    "PYI",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
# D/DOC: docstring section structure is not enforced in tests.
"**/tests/**" = ["D", "DOC"]
"**/conftest.py" = ["D", "DOC"]

[tool.ruff.lint.isort]
known-first-party = ["xorq_datafusion"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.git-cliff.changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}

### Details\

{% for group, commits in commits | group_by(attribute="group") %}
    #### {{ group | upper_first }}
    {%- for commit in commits %}
        - {{ commit.message | upper_first | trim }}\
            {% if commit.github.username %} by @{{ commit.github.username }}{%- endif -%}
            {% if commit.github.pr_number %} in \
              [#{{ commit.github.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.github.pr_number }}) \
            {%- endif -%}
    {% endfor %}
{% endfor %}

{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
  ## New Contributors
{%- endif -%}

{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
  * @{{ contributor.username }} made their first contribution
    {%- if contributor.pr_number %} in \
      [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}) \
    {%- endif %}
{%- endfor %}\n
"""
trim = true


[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_preprocessors = [
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
commit_parsers = [
    { message = "^.*: add", group = "Added" },
    { message = "^.*: support", group = "Added" },
    { message = "^.*: remove", group = "Removed" },
    { message = "^.*: delete", group = "Removed" },
    { message = "^test", group = "Fixed" },
    { message = "^fix", group = "Fixed" },
    { message = "^.*: fix", group = "Fixed" },
    { message = "^.*", group = "Changed" },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
