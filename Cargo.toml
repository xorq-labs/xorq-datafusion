[package]
name = "xorq-datafusion"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "xorq_datafusion"
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.52", features = ["macros", "rt", "rt-multi-thread", "sync"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"]}
datafusion = { version = "55.2", features = ["avro", "unicode_expressions"]}
datafusion-common = { version = "55.2" }
datafusion-expr = "55.2"
datafusion-ffi = "55.2"
datafusion-proto = { version = "55.2", default-features = false }
prost = "0.14.3"
datafusion-optimizer = "55.2"
datafusion-sql = "55.2"
futures = "0.3"
async-trait = "=0.1.89"
arrow = { version = "59", features = ["pyarrow"] }
# Default features pull in aws-lc-rs (a large C build); the rest of the tree
# already uses ring, so the HTTPS client is configured with rustls-ring in
# object_storage.rs instead.
aws-config = { version = "1.8", default-features = false, features = ["rt-tokio", "credentials-process", "sso"] }
aws-credential-types = "1.2"
aws-smithy-http-client = { version = "1.5", features = ["rustls-ring"] }
object_store = { version = "0.13.1", features = ["aws", "gcp", "http"] }
url = "2.5.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["float_roundtrip"] }

# Full DWARF is not needed for the Python test loop. Line tables keep file and
# line numbers for this crate in panics and backtraces; dependencies carry no
# debuginfo at all: the debug `.so` drops from ~950 MB to ~245 MB, `target/debug`
# from ~4.6 GB to ~2.0 GB, and every link gets shorter. Override per invocation
# when stepping through Rust in a debugger. Both keys are needed, since the
# per-package override below wins over the profile-level setting for
# dependencies:
#   maturin develop --config 'profile.dev.debug=true' \
#       --config 'profile.dev.package."*".debug=true'
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 2
strip = true
