[package]
name = "xorq-datafusion"
version = "0.2.4"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "xorq_datafusion"
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.47", features = ["macros", "rt", "rt-multi-thread", "sync"] }
pyo3 = { version = "0.25.0", features = ["extension-module", "abi3", "abi3-py38"] }
pyo3-async-runtimes = { version = "0.25.0", features = ["tokio-runtime"]}
datafusion =  { version = "50.0", features = ["pyarrow", "avro"]}
datafusion-common = { version = "50.0", features = ["pyarrow"] }
datafusion-expr = "50.0"
prost = "=0.13.5"
datafusion-optimizer = "50.0"
datafusion-sql = "50.0"
futures = "=0.3.31"
async-trait = "=0.1.89"
arrow = "56"
arrow-ord = "56"
aws-config = "=0.101.0"
aws-credential-types = "=0.101.0"
object_store = { version = "=0.12.4", features = ["aws", "gcp", "http"] }
url = "2.5.7"
