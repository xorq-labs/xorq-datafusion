name: ci-test

on:
  push:
    # Skip the backend suite if all changes are docs
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.qmd"
      - "*.md"
      - "codecov.yml"
      - ".envrc"
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, x86]
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      # abi3 builds one binary for every Python version, so python-version
      # is not part of the key. rust-cache adds the rustc version and
      # Cargo.lock, and falls back to the newest cache on a miss.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --group dev --group test --no-install-project
        working-directory: ${{ github.workspace }}

      - name: maturin develop
        uses: PyO3/maturin-action@v1
        with:
          command: 'develop'
          args: '--release --strip'
          target: ${{ matrix.target }}
          sccache: 'true'
          manylinux: 'auto'

      - name: pytest
        run: uv run --no-sync pytest --import-mode=importlib --cov --cov-report=xml
        working-directory: ${{ github.workspace }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
