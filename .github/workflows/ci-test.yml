name: ci-test

on:
  push:
    # Skip the backend suite if all changes are docs
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.qmd"
      - "*.md"
      - "codecov.yml"
      - ".envrc"
    branches:
      - main
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read


jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # requires-python = ">=3.10": test the floor and the newest release.
        # 32-bit wheels are still built and published by ci-release.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # abi3 builds one binary for every Python version, so python-version
      # is not part of the key. rust-cache adds the rustc version and
      # Cargo.lock, and falls back to the newest cache on a miss.
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --group dev --group test --no-install-project
        working-directory: ${{ github.workspace }}

      # Dev profile: the release profile (thin LTO, codegen-units = 2) is the
      # slowest to build and buys nothing for running pytest. Built on the
      # host, not in a manylinux container, so rust-cache sees ./target.
      - name: maturin develop
        run: uv run --no-sync maturin develop --uv

      - name: pytest
        run: uv run --no-sync pytest --import-mode=importlib --cov --cov-report=xml
        working-directory: ${{ github.workspace }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
